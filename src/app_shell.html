<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dayeon Kang — Portfolio</title>
<meta name="description" content="Dayeon Kang: research and engineering portfolio. Machine metacognition, assistive hardware, civic systems. Every claim states what was built, what was only simulated and what is still a plan.">
<meta property="og:title" content="Dayeon Kang — Portfolio">
<meta property="og:description" content="Machine metacognition, assistive hardware, civic systems.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://dayeon603-pixel.github.io/">
<meta property="og:image" content="https://dayeon603-pixel.github.io/img/me.jpg">
<meta name="theme-color" content="#FDFAF6">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --wash:#FDFAF6; --card:#FFFFFF; --ghost:#ECE9E5; --hair:#E6E2DC;
  --ink:#2B2B2B; --grey:#726F6C; --faint:#8A8784;
  --lav:#8E8BC0; --lavt:#6F6CA6; --lav2:#B5B5D5; --lav3:#D6D6E8; --lav4:#EDEDF6; --navy:#5F5C8F;
  --band:88px;
  --f:"IBM Plex Sans","IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --sheet:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--wash);color:var(--ink);font-family:var(--f);
  font-weight:400;font-size:17px;line-height:1.62;letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:var(--navy)}

/* ---------- running head ---------- */
.topband{position:fixed;top:0;left:0;right:0;height:10px;background:var(--lav2);z-index:60}
.rail{position:fixed;top:10px;left:0;right:0;z-index:59;background:rgba(253,250,246,.93);
  backdrop-filter:saturate(1.1) blur(8px);border-bottom:1px solid var(--hair)}
.rail-in{max-width:var(--sheet);margin:0 auto;display:flex;align-items:center;gap:18px;min-width:0;
  padding:9px clamp(18px,4vw,48px)}
.rail .me{font-weight:600;font-size:14px;color:var(--navy);letter-spacing:.01em;
  text-decoration:none;white-space:nowrap}
.rail nav{flex:1 1 auto;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  justify-content:center;-webkit-overflow-scrolling:touch}
.rail nav::-webkit-scrollbar{display:none}
.rail nav a{font-size:13.5px;font-weight:500;color:var(--grey);text-decoration:none;
  padding:5px 11px;border-radius:999px;white-space:nowrap;transition:color .15s,background .15s}
.rail nav a:hover{color:var(--ink);background:var(--lav4)}
.rail nav a[aria-current="true"]{color:var(--navy);background:var(--lav4);font-weight:600}
.rail .mark{font-size:11.5px;font-weight:500;color:var(--lavt);letter-spacing:.22em;
  font-style:italic;white-space:nowrap}
@media (max-width:900px){.rail .mark{display:none}.rail nav{justify-content:flex-start}}
@media (max-width:620px){.rail .me{display:none}.rail-in{gap:0;padding-inline:12px}}

/* ---------- cover ---------- */
.cover{position:relative;min-height:100svh;display:flex;flex-direction:column;
  justify-content:center;padding:clamp(92px,11vh,132px) clamp(18px,4vw,48px) clamp(36px,6vh,72px);
  max-width:var(--sheet);margin:0 auto;overflow:hidden}
.cover .eyebrow{font-size:13px;font-style:italic;color:var(--lavt);letter-spacing:.06em;
  margin:0 0 clamp(26px,5vh,56px)}
.wordmark{position:relative;margin:0;line-height:.84;font-weight:700;letter-spacing:-.025em;
  font-size:clamp(2.9rem,10.6vw,8.2rem);color:#6E6B68}
.wordmark .b{display:block}
.cover-row{position:relative;display:flex;align-items:flex-end;gap:clamp(16px,4vw,54px)}
.cover-txt{flex:1;min-width:0}
.plate{display:inline-block;background:var(--lav2);color:#fff;font-weight:600;
  font-size:clamp(1rem,2.4vw,1.45rem);letter-spacing:.04em;
  padding:clamp(9px,1.4vw,15px) clamp(26px,4.4vw,56px);margin-top:clamp(14px,2.4vw,26px);
  transform:skewX(-9deg)}
.plate span{display:inline-block;transform:skewX(9deg)}
.portrait{flex:0 0 clamp(140px,22vw,264px);align-self:flex-end}
.portrait img{width:100%;height:clamp(190px,34vh,350px);object-fit:cover;object-position:50% 18%;
  border-radius:3px;border:1px solid var(--hair)}
.cover-sub{margin:clamp(22px,3.4vw,34px) 0 0;font-size:clamp(1rem,1.8vw,1.22rem);
  color:var(--ink);font-weight:500;max-width:46ch}
.fine{margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--grey)}
.fine a{color:var(--lavt);text-decoration:none;font-style:italic}
.cover-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(20px,3vw,30px)}
.cta{display:inline-block;text-decoration:none;font-size:14.5px;font-weight:600;
  padding:10px 22px;border-radius:999px;transition:transform .14s,box-shadow .14s}
.cta.solid{background:var(--lav);color:#fff}
.cta.ghost{background:#fff;color:var(--navy);border:1px solid var(--hair)}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 18px -12px rgba(60,55,110,.6)}
@media (max-width:700px){
  .cover-row{flex-direction:column;align-items:flex-start}
  .portrait{flex:none;width:min(60vw,250px);align-self:center;margin:22px 0 0}
}

/* ---------- sheets ---------- */
.sheet{position:relative;max-width:var(--sheet);margin:0 auto;
  padding:clamp(54px,8vh,104px) clamp(18px,4vw,48px) clamp(40px,6vh,74px)}
.sheet+.sheet{border-top:1px solid var(--hair)}
.wm{position:absolute;top:clamp(26px,5vh,58px);left:clamp(14px,3.6vw,42px);
  font-size:clamp(2.2rem,6.4vw,4.3rem);font-weight:700;font-style:italic;color:var(--ghost);
  letter-spacing:-.01em;line-height:1;pointer-events:none;user-select:none;white-space:nowrap;
  max-width:92%;overflow:hidden;text-overflow:clip}
.head{position:relative;display:flex;gap:clamp(12px,2.4vw,26px);align-items:baseline;
  margin:clamp(22px,4.4vh,54px) 0 0}
.num{font-size:clamp(.95rem,1.5vw,1.12rem);font-weight:700;color:var(--lavt);flex:0 0 auto;
  line-height:1.3;padding-top:.28em}
.head h2{margin:0;font-size:clamp(1.55rem,3.5vw,2.45rem);font-weight:700;line-height:1.24;
  letter-spacing:-.012em}
.head h2 .ko{font-weight:600}
.lede{margin:12px 0 0;max-width:72ch;color:#4A4845;font-size:clamp(1rem,1.5vw,1.1rem);line-height:1.6}
.sheet.div{padding-top:clamp(70px,11vh,140px);padding-bottom:clamp(30px,5vh,56px)}
.sheet.div .head h2{font-size:clamp(1.9rem,5vw,3.1rem)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--lavt);margin:0 0 6px}

/* ---------- body grid ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:clamp(20px,3.2vw,46px);margin-top:clamp(22px,3.6vh,38px);align-items:start}
.grid.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.rows{display:flex;flex-direction:column;gap:10px;margin:0}
.group{margin:clamp(20px,3vh,30px) 0 10px;font-size:12px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--lavt)}
.group:first-child{margin-top:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,1.8vw,20px);
  background:var(--card);border:1px solid var(--hair);border-radius:3px;
  padding:clamp(13px,1.9vw,18px) clamp(14px,2.1vw,22px);align-items:start}
.row>.i{font-weight:700;color:var(--lavt);font-size:1.02rem;line-height:1.5;min-width:1.1em}
.row dt,.row .t{font-weight:600;font-size:1.02rem;margin:0;color:var(--ink)}
.row dd,.row .d{margin:3px 0 0;color:#4A4845;font-size:.97rem;line-height:1.6}
.row strong{font-weight:600;color:var(--navy)}
.row code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:var(--lav4);padding:1px 5px;border-radius:3px}
.row a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--lav3)}
.row a:hover{border-bottom-color:var(--lav)}

/* ---------- figures ---------- */
.figs{display:flex;flex-direction:column;gap:clamp(14px,2.2vw,22px)}
figure.fg{margin:0;background:var(--card);border:1px solid var(--hair);border-radius:3px;
  padding:clamp(10px,1.5vw,16px)}
figure.fg img,figure.fg svg{width:100%;height:auto;border-radius:2px}
figure.fg.phone img{max-width:250px;margin-inline:auto}
figcaption{margin-top:9px;font-size:12.5px;line-height:1.5;color:var(--grey)}

/* ---------- check strip ---------- */
.strip{display:flex;flex-wrap:wrap;gap:clamp(14px,2.6vw,34px);align-items:center;
  margin-top:clamp(20px,3.4vh,34px);padding-top:clamp(16px,2.6vh,22px);
  border-top:3px solid var(--lav4)}
.chk{display:flex;align-items:center;gap:9px;font-size:.95rem}
.chk .dot{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--lav2);
  display:flex;align-items:center;justify-content:center}
.chk .dot svg{width:11px;height:11px;display:block}
.chk b{font-weight:600;color:var(--ink)}
.chk span{color:var(--grey)}
.tag{display:inline-block;background:var(--lav4);color:var(--navy);font-size:12.5px;
  font-weight:600;padding:4px 12px;border-radius:999px;margin-top:14px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.linkrow a{font-size:13.5px;font-weight:500;color:var(--navy);text-decoration:none;
  background:#fff;border:1px solid var(--hair);border-radius:999px;padding:6px 15px;
  transition:border-color .14s,transform .14s}
.linkrow a:hover{border-color:var(--lav2);transform:translateY(-1px)}

/* ---------- contents ---------- */
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));
  gap:clamp(10px,1.6vw,16px);margin-top:clamp(22px,3.6vh,36px)}
.toc a{display:flex;gap:14px;align-items:baseline;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--hair);border-radius:3px;
  padding:clamp(14px,2vw,20px);transition:border-color .14s,transform .14s}
.toc a:hover{border-color:var(--lav2);transform:translateY(-2px)}
.toc .i{font-weight:700;color:var(--lavt);font-size:.95rem}
.toc b{display:block;font-weight:600;font-size:1.06rem}
.toc span{display:block;margin-top:3px;font-size:.92rem;color:var(--grey);line-height:1.5}

/* ---------- project index inside a section ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));
  gap:clamp(10px,1.6vw,16px);margin-top:clamp(18px,3vh,30px)}
.cards a{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--hair);border-left:3px solid var(--lav2);border-radius:3px;
  padding:clamp(13px,1.9vw,18px);transition:border-left-color .14s,transform .14s}
.cards a:hover{border-left-color:var(--lav);transform:translateY(-2px)}
.cards b{display:block;font-weight:600;font-size:1rem}
.cards span{display:block;margin-top:4px;font-size:.9rem;color:var(--grey);line-height:1.5}

/* ---------- notes block ---------- */
.note{margin-top:clamp(18px,3vh,28px);background:var(--lav4);border-radius:3px;
  padding:clamp(14px,2.2vw,20px) clamp(16px,2.4vw,24px)}
.note b{display:block;font-size:.95rem;font-weight:600;color:var(--navy);margin-bottom:6px}
.note ul{margin:0;padding-left:1.15em}
.note li{font-size:.95rem;line-height:1.6;color:#4A4845;margin-bottom:4px}
.note li:last-child{margin-bottom:0}
.note a{color:var(--navy)}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));
  gap:clamp(10px,1.6vw,16px);margin-top:clamp(22px,3.6vh,34px)}
.contact a{background:var(--card);border:1px solid var(--hair);border-radius:3px;
  padding:clamp(14px,2vw,20px);text-decoration:none;color:inherit;transition:border-color .14s}
.contact a:hover{border-color:var(--lav2)}
.contact .k{display:block;font-size:12px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--lavt)}
.contact .v{display:block;margin-top:5px;font-size:1rem;font-weight:500;overflow-wrap:anywhere}

/* ---------- footer ---------- */
footer{max-width:var(--sheet);margin:0 auto;padding:clamp(34px,5vh,60px) clamp(18px,4vw,48px) 30px;
  border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:12px;
  justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--grey)}
footer a{color:var(--lavt);text-decoration:none;font-style:italic}
.botband{height:14px;background:var(--lav2)}
.totop{position:fixed;right:clamp(14px,2.6vw,28px);bottom:clamp(22px,3vh,34px);z-index:58;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:#fff;
  color:var(--navy);font-size:15px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .2s;box-shadow:0 8px 20px -14px rgba(60,55,110,.9)}
.totop.on{opacity:1;pointer-events:auto}
@media print{.rail,.topband,.totop{display:none}.sheet{page-break-inside:avoid}}
</style>
</head>
<body>
<div class="topband" aria-hidden="true"></div>
<header class="rail">
  <div class="rail-in">
    <a class="me" href="#top">Dayeon Kang</a>
    <nav aria-label="Sections">{{NAV}}</nav>
    <div class="mark" aria-hidden="true">PORTFOLIO 2026</div>
  </div>
</header>
<main id="top">
{{MAIN}}
</main>
<footer>
  <div>강다연 &middot; Dayeon Kang &middot; Seongnam, Korea</div>
  <div>Arbiter, business registration 414-01-72904 &middot; <a href="https://dayeon603-pixel.github.io">dayeon603-pixel.github.io</a></div>
</footer>
<div class="botband" aria-hidden="true"></div>
<button class="totop" id="totop" type="button" aria-label="Back to top">&uarr;</button>
<script>
(function(){
  /* old notebook hashes keep working */
  var H = location.hash.slice(1);
  if (H && /^(s|p)\//.test(H)) {
    var a = {'p/landauer':'research','p/neurovoice':'hardware','p/signet':'arbiter','p/tollgate':'arbiter'};
    var k = a[H] || H.slice(2);
    if (k === 'about' || k === 'cover' || k === 'menu') k = 'top';
    location.replace('#' + k);
  }

  var links = [].slice.call(document.querySelectorAll('.rail nav a'));
  var targets = links.map(function(l){ return document.getElementById(l.hash.slice(1)); });
  function mark(){
    var best = 0, y = window.scrollY + 110;
    targets.forEach(function(t, i){ if (t && t.offsetTop <= y) best = i; });
    if (window.scrollY < 80) best = -1;
    links.forEach(function(l, i){ l.setAttribute('aria-current', i === best ? 'true' : 'false'); });
    var b = document.getElementById('totop');
    b.classList.toggle('on', window.scrollY > 700);
  }
  var tick = false;
  window.addEventListener('scroll', function(){
    if (tick) return; tick = true;
    requestAnimationFrame(function(){ mark(); tick = false; });
  }, {passive:true});
  document.getElementById('totop').addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
  mark();
})();
</script>
</body>
</html>
